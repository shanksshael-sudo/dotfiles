; ShanksCorp Polybar — 3 floating pills
[color]
bg      = #DD0a0a0f
bg-alt  = #EE1a1a2e
fg      = #e0e0e0
dim     = #7777aa
accent  = #00f5ff
border  = #BB00c8d4
trans   = #00000000
red     = #ff4466
green   = #00ff88
yellow  = #ffcc00
black   = #2a2a44

[global/wm]
margin-top    = 0
margin-bottom = 0

; ── LEFT BAR ────────────────────────────────────────────────────────────────
[bar/shanks-left]
monitor      = ${env:MONITOR:}
width        = 37.5%
height       = 36
offset-x     = 1%
offset-y     = 6
fixed-center = false
background   = ${color.bg}
foreground   = ${color.fg}
radius       = 12.0
border-size  = 1
border-color = ${color.border}
padding      = 2
module-margin-left  = 2
module-margin-right = 2
font-0 = "Audiowide:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=14;3"
modules-left   = launcher sep bspwm
modules-center =
modules-right  = cpu sep memory
wm-restack    = bspwm
enable-ipc    = true
cursor-click  = pointer
cursor-scroll = ns-resize

; ── CENTER BAR ──────────────────────────────────────────────────────────────
[bar/shanks-center]
monitor      = ${env:MONITOR:}
width        = 20%
height       = 36
offset-x     = 40%
offset-y     = 6
fixed-center = true
background   = ${color.bg}
foreground   = ${color.fg}
radius       = 12.0
border-size  = 1
border-color = ${color.border}
padding      = 1
module-margin-left  = 2
module-margin-right = 2
font-0 = "Audiowide:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=14;3"
modules-left   =
modules-center = clock
modules-right  =
wm-restack    = bspwm
enable-ipc    = true

; ── RIGHT BAR ───────────────────────────────────────────────────────────────
[bar/shanks-right]
monitor      = ${env:MONITOR:}
width        = 37.5%
height       = 36
offset-x     = 61.5%
offset-y     = 6
fixed-center = false
background   = ${color.bg}
foreground   = ${color.fg}
radius       = 12.0
border-size  = 1
border-color = ${color.border}
padding      = 2
module-margin-left  = 2
module-margin-right = 2
font-0 = "Audiowide:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=14;3"
modules-left   = volume
modules-center = wifi sep bluetooth sep hotspot
modules-right  = battery sep power
wm-restack    = bspwm
enable-ipc    = true
cursor-click  = pointer
cursor-scroll = ns-resize

; ── MODULES ─────────────────────────────────────────────────────────────────

[module/launcher]
type            = custom/text
label           = " "
label-foreground = ${color.accent}
click-left      = rofi -show drun -theme ~/.config/rofi/launcher.rasi &

[module/sep]
type            = custom/text
label           = " | "
label-foreground = ${color.black}

[module/bspwm]
type = internal/bspwm
enable-click   = true
enable-scroll  = true
pin-workspaces = true
format = <label-state>
label-focused              = " %name% "
label-focused-foreground   = #0a0a0f
label-focused-background   = ${color.accent}
label-occupied             = " %name% "
label-occupied-foreground  = ${color.dim}
label-empty                = " %name% "
label-empty-foreground     = ${color.black}
label-urgent               = " %name% "
label-urgent-foreground    = ${color.red}

[module/cpu]
type             = internal/cpu
interval         = 2
format-prefix    = ""
format-prefix-foreground = ${color.accent}
label            = "%percentage%%"
label-foreground = ${color.dim}

[module/memory]
type             = internal/memory
interval         = 3
format-prefix    = " "
format-prefix-foreground = ${color.accent}
label            = "%used%"
label-foreground = ${color.dim}

[module/clock]
type             = internal/date
interval         = 1
time             = "%H:%M"
date             = "%a %d %b"
label            = " %date%   %time%"
label-foreground = ${color.accent}

[module/brightness]
type             = internal/backlight
card             = intel_backlight
use-actual-brightness = true
enable-scroll    = true
format           = <ramp><label>
label            = "%percentage%%"
label-foreground = ${color.dim}
ramp-0           = "󰃞 "
ramp-1           = "󰃟 "
ramp-2           = "󰃠 "
ramp-foreground  = ${color.yellow}

[module/volume]
type                    = internal/pulseaudio
use-ui-max              = false
interval                = 5
enable-scroll           = true
format-volume           = <ramp-volume><label-volume>
label-volume            = "%percentage%%"
label-volume-foreground = ${color.dim}
format-muted            = <label-muted>
label-muted             = "󰝟 muted"
label-muted-foreground  = ${color.red}
ramp-volume-0           = "󰕿 "
ramp-volume-1           = "󰖀 "
ramp-volume-2           = "󰕾 "
ramp-volume-foreground  = ${color.accent}
click-right             = pavucontrol &

[module/wifi]
type          = custom/script
exec          = ~/.config/polybar/scripts/wifi.sh
interval      = 5
label         = %output%
label-foreground = #7777aa
click-left    = airctl &

[module/bluetooth]
type          = custom/script
exec          = ~/.config/polybar/scripts/bluetooth.sh
interval      = 5
label         = "%output%"
label-foreground = ${color.dim}
click-left    = blueman-manager &

[module/battery]
type                    = internal/battery
battery                 = BAT1
adapter                 = ACAD
full-at                 = 98
poll-interval           = 5
format-charging         = <animation-charging><label-charging>
label-charging          = "%percentage%%"
label-charging-foreground = ${color.green}
format-discharging      = <ramp-capacity><label-discharging>
label-discharging       = "%percentage%%"
label-discharging-foreground = ${color.fg}
format-full-prefix      = "󱟢 "
format-full-prefix-foreground = ${color.accent}
label-full              = "Full"
ramp-capacity-0         = "󰁺 "
ramp-capacity-1         = "󰁼 "
ramp-capacity-2         = "󰁾 "
ramp-capacity-3         = "󰂀 "
ramp-capacity-4         = "󰂂 "
ramp-capacity-foreground = ${color.fg}
animation-charging-0    = "󰢜 "
animation-charging-1    = "󰂆 "
animation-charging-2    = "󰂇 "
animation-charging-3    = "󰂈 "
animation-charging-4    = "󰂉 "
animation-charging-foreground = ${color.green}
animation-charging-framerate  = 700

[module/power]
type              = custom/text
label             = "󰐥"
label-foreground  = ${color.accent}
click-left        = ~/.config/rofi/powermenu/powermenu.sh &

[settings]
screenchange-reload  = false
pseudo-transparency  = false

[module/hotspot]
type = custom/text
content = " 󰀃  " 
content-foreground = #00FFFF
click-left = localsend &
